<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Newsletter Sign-up</title>
</head>
<body>
    <h1>Subscribe to our Newsletter</h1>
    <form>
        <p>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname">
        </p>
        <p>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname">
        </p>
        <p>
            How would you like to receive your newsletter?<br>
            <input type="radio" id="post" name="delivery" value="post">
            <label for="post">Post</label><br>
            <input type="radio" id="email" name="delivery" value="email">
            <label for="email">E-mail</label><br>
            <input type="radio" id="telegram" name="delivery" value="telegram">
            <label for="telegram">Singing telegram</label>
        </p>
        <p>
            How often do you wish to receive your newsletter?<br>
            <input type="checkbox" id="daily" name="frequency" value="daily">
            <label for="daily">daily</label><br>
            <input type="checkbox" id="weekly" name="frequency" value="weekly">
            <label for="weekly">weekly</label><br>
            <input type="checkbox" id="monthly" name="frequency" value="monthly">
            <label for="monthly">monthly</label>
        </p>
        <p>
            <label for="pwd">Password:</label>
            <input type="password" id="pwd" name="pwd">
        </p>
        <p>
            <input type="submit" value="Submit">
        </p>
    </form>
</body>
</html>
